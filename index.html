<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="오피키나 디자인 레퍼런스 · 각 이미지와 사이트의 권리는 원본 제작자에게 있음">
<title>오피키나 디자인킷</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fff;
  --bg-soft:#f5f5f6;
  --wash:#f2f1f3;
  --ink:#19171c;
  --muted:#6e6e73;
  --subtle:#97979b;
  --line:#e5e4e7;
  --line-2:#d7d7db;
  --card:#fff;
  --purple:#7a40ed;
  --lavender:#9b6cf0;
  --lavender-2:#b293fe;
  --lilac:#f2ecfd;
  --lilac-2:#e4d9fb;
  --blue:#29a9ff;
  --danger:#fd3456;
  --shadow:0 0 0 1px #e5e4e7, 0 1px 2px #19171c0f, 0 12px 28px #00000012;
  --shadow-sm:0 0 0 1px #e5e4e7, 0 1px 2px #19171c0a;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:0deg;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;color:var(--ink);font-family:var(--sans);
  min-height:100vh;word-break:keep-all;background:var(--bg);
  font-feature-settings:"ss01" on,"cv01" on;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
a{color:var(--purple);text-decoration:none}
a:hover{color:#5c2ec2;text-decoration:underline}
.sc{letter-spacing:.02em}

.page{
  position:relative;
  max-width:1120px;margin:0 auto;
  padding:0 32px 80px;
}

/* ----- top bar ----- */
.plate{padding:0}
.topbar{
  display:flex;align-items:center;gap:28px;
  height:72px;margin:0 -32px;padding:0 32px;
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-bottom:1px solid transparent;
}
.topbar.is-stuck{border-bottom-color:var(--line)}
.dept{
  margin:0;font-size:16px;font-weight:700;letter-spacing:-.03em;
  color:var(--ink);white-space:nowrap;
}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  margin:0 auto 18px;padding:5px 12px 5px 14px;
  font-size:13px;font-weight:500;color:var(--muted);
  background:var(--wash);border-radius:999px;line-height:1.3;
}
.kicker a,.kicker em{color:var(--purple);font-style:normal;font-weight:500;text-decoration:none}

.modes{display:flex;align-items:center;gap:2px;flex:1}
.modes button{
  padding:8px 14px;font-size:14px;font-weight:500;
  color:var(--muted);border-radius:999px;letter-spacing:-.01em;
}
.modes button:hover{color:var(--ink);background:var(--wash)}
.modes button.on{color:#fff;background:var(--ink)}
.numwrap{display:flex;align-items:baseline;gap:6px;margin-left:auto}
.numwrap .dr{font-size:12px;color:var(--subtle);font-weight:500}
.num{font-size:18px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1;color:var(--ink)}

/* ----- hero ----- */
.hero{
  text-align:center;padding:72px 0 28px;
}
.hero h1{
  font-weight:800;font-size:clamp(48px,7.2vw,88px);
  line-height:.98;letter-spacing:-.045em;
  margin:0 auto;max-width:16ch;
  animation:rise .55s ease both;
}
.note{
  font-size:16px;line-height:1.55;margin:22px auto 0;max-width:36em;
  color:var(--muted);font-weight:450;
  animation:rise .55s ease .08s both;
}
.tally{
  display:inline-grid;grid-auto-flow:column dense;grid-template-rows:auto auto;
  justify-content:center;gap:2px 36px;margin:28px auto 0;padding:0;
  font-size:13px;
}
.tally dt{color:var(--subtle);margin:0;grid-row:2;font-weight:500}
.tally dd{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;grid-row:1;color:var(--ink)}
.howto{font-size:13px;line-height:1.6;margin:0;color:var(--muted)}
.howto kbd{
  font-family:var(--mono);font-size:11.5px;
  border:1px solid var(--line-2);border-radius:6px;
  padding:1px 6px;background:var(--bg);color:var(--ink);
}
.credit-side{margin:0;font-size:13px;line-height:1.5;color:var(--subtle)}
.credit-side a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.credit-side a:hover{color:var(--ink)}

@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

/* ----- cabinet / main ----- */
.cabinet{position:relative;min-width:0;margin-top:8px}
.wood{background:transparent}
.lip{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:center;
  gap:4px;padding:4px;margin:0 auto 22px;max-width:100%;
  overflow-x:auto;white-space:nowrap;
  font-size:13px;font-weight:500;
  background:var(--wash);border-radius:999px;width:fit-content;
}
.lip button{
  color:var(--muted);padding:7px 14px;border-radius:999px;letter-spacing:-.01em;
}
.lip button:hover{color:var(--ink)}
.lip button.on{color:#fff;background:var(--ink)}
.lip .sp{display:none}
.frame{background:transparent;border:0}
.tray{padding:0 0 8px;min-height:280px;background:transparent}
.front{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:12px 24px;
  margin:64px -32px 0;padding:48px 32px 24px;
  background:var(--wash);border-top:0;
  border-radius:32px 32px 0 0;
}
.holder{display:none}
.front-label{margin:0;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;text-transform:none}
.front-credit{margin:0;font-size:13px;color:var(--subtle)}

/* ----- cards ----- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px 16px}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px 14px}
.spec{
  display:flex;flex-direction:column;align-items:stretch;text-align:left;
  color:inherit;text-decoration:none;background:var(--card);
  border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:transform .25s ease, box-shadow .25s ease;
}
.spec:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mount{
  aspect-ratio:16/10;background:var(--wash);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.mount img,.mount video{width:100%;height:100%;object-fit:cover;display:block}
.mount .fsample{width:100%;height:100%;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden;color:var(--ink);background:#fff;text-align:left}
.fsample .fn{font-size:21px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsample .fs{font-size:15px;line-height:1.3;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet .fig .fsample{min-height:240px;height:100%;padding:28px 26px;gap:10px}
.sheet .fig .fsample .fn{font-size:34px;white-space:normal}
.sheet .fig .fsample .fs{font-size:22px;white-space:normal}
.sheet .meta pre{margin:0;padding:10px 12px;background:var(--bg-soft);border-radius:12px;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto;color:var(--muted)}
.mount .ph{font-size:13px;font-weight:600;color:var(--subtle);letter-spacing:-.01em;padding:12px;text-align:center;line-height:1.35}
.lab{margin:0;padding:12px 14px 14px;background:var(--card);transform:none}
.lab strong{display:block;font-weight:600;font-size:14px;line-height:1.35;letter-spacing:-.02em}
.lab span{display:block;font-size:12px;color:var(--subtle);margin-top:3px;line-height:1.35;font-weight:500}

.empty{padding:56px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}
.row-title{
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);margin:36px 0 14px;padding:0;
  border:0;text-transform:none;
}
.row-title:first-child{margin-top:8px}

.paste{
  display:grid;grid-template-columns:1fr auto;gap:10px;margin:0 auto 8px;
  padding:0;background:transparent;border:0;max-width:640px;
}
.paste input{
  border:0;background:var(--bg-soft);border-radius:999px;
  padding:14px 20px;outline:none;min-width:0;font-size:15px;font-weight:450;
  color:var(--ink);
  box-shadow:inset 0 0 0 1px transparent;
  transition:box-shadow .15s ease, background .15s ease;
}
.paste input::placeholder{color:var(--subtle)}
.paste input:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn{
  font-size:14px;font-weight:600;padding:12px 20px;
  border:0;background:var(--ink);color:#fff;
  border-radius:999px;letter-spacing:-.01em;
  white-space:nowrap;transition:background .15s ease,transform .15s ease;
}
.btn:hover{background:#2d2a31}
.btn:active{transform:scale(.98)}
.btn.ghost{
  background:transparent;color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line-2);
}
.btn.ghost:hover{background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.warn{font-size:14px;line-height:1.55;color:var(--danger);margin:0 auto 14px;text-align:center;max-width:40em}
.hint{font-size:13.5px;color:var(--muted);margin:0 auto 20px;line-height:1.55;text-align:center;max-width:40em}
.preview-wrap{margin:0 0 28px;display:flex;justify-content:center}
.preview-wrap .spec{max-width:320px;width:100%}
.ask{margin:0 auto 36px;text-align:center}
.ask .paste{margin:0 auto 10px}
.ask .lead{
  font-size:13px;font-weight:500;letter-spacing:0;
  color:var(--muted);margin:0 0 16px;text-transform:none;
}
.ask .btn{background:var(--lavender);color:#fff}
.ask .btn:hover{background:var(--purple)}
.rec-status{font-size:14px;color:var(--muted);margin:8px auto 22px;line-height:1.55;text-align:center;max-width:40em}
.fav-mark{
  display:inline-block;margin-left:6px;font-size:11px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--purple);
  background:var(--lilac);border-radius:999px;padding:1px 7px;
}

.galleries{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px;justify-content:center}
.galleries a{
  display:block;padding:12px 16px;background:var(--card);
  border:0;text-decoration:none;color:var(--ink);
  box-shadow:var(--shadow-sm);font-size:14px;line-height:1.35;
  border-radius:16px;font-weight:600;letter-spacing:-.02em;
  transition:transform .2s ease, box-shadow .2s ease;
}
.galleries a:hover{text-decoration:none;color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow)}
.galleries a small{display:block;font-size:12px;font-weight:500;color:var(--subtle);margin-top:3px}

/* ----- dialog ----- */
dialog{
  border:0;padding:0;max-width:760px;width:calc(100% - 32px);
  background:#fff;color:var(--ink);
  border-radius:24px;box-shadow:var(--shadow);
  overflow:hidden;
}
dialog::backdrop{background:rgba(25,23,28,.4);backdrop-filter:blur(6px)}
.sheet{display:grid;grid-template-columns:1.05fr .95fr;min-height:300px}
.sheet .fig{background:var(--wash);min-height:240px}
.sheet .fig img,.sheet .fig video{width:100%;height:100%;object-fit:contain;display:block;max-height:70vh;background:#19171c}
.sheet .meta{padding:28px 26px 24px;display:flex;flex-direction:column;gap:8px}
.sheet .meta h2{font-weight:800;font-style:normal;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.035em}
.sheet .meta p{margin:0;font-size:14.5px;line-height:1.6;color:var(--muted)}
.sheet .meta .lbl{font-size:12px;letter-spacing:0;text-transform:none;color:var(--subtle);margin-top:8px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px}
.actions select,.actions textarea,.field input{
  border:0;background:var(--bg-soft);padding:10px 12px;font-size:14px;
  border-radius:12px;outline:none;
}
.actions select:focus,.actions textarea:focus,.field input:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
.actions textarea{width:100%;min-height:64px;resize:vertical}
.actions .btn:not(.ghost){background:var(--ink)}
.actions .btn#d-fav{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.actions .btn#d-fav:hover{background:var(--wash)}
.close-x{
  position:absolute;top:12px;right:14px;font-size:22px;line-height:1;
  color:var(--subtle);z-index:2;padding:6px 8px;border-radius:999px;
  background:rgba(255,255,255,.8);
}
.close-x:hover{color:var(--ink);background:#fff}

@media (max-width:860px){
  .page{padding:0 18px 56px}
  .topbar{margin:0 -18px;padding:0 18px;height:60px;gap:12px}
  .hero{padding:44px 0 20px}
  .hero h1{font-size:clamp(36px,12vw,56px)}
  .sheet{grid-template-columns:1fr}
  .front{margin:48px -18px 0;padding:36px 18px 20px;border-radius:24px 24px 0 0}
  .modes button{padding:7px 11px;font-size:13px}
  .paste{grid-template-columns:1fr;justify-items:center}
  .paste input{width:100%}
}
</style>
</head>
<body>
<div class="page">
  <header class="plate">
    <div class="topbar">
      <p class="dept">오피키나 디자인킷</p>
      <nav class="modes" aria-label="보기 전환">
        <button type="button" id="btn-mine" hidden>내 서랍</button>
        <button type="button" id="btn-browse">둘러보기</button>
      </nav>
      <div class="numwrap">
        <p class="num" id="big-num">0</p>
        <span class="dr">개</span>
      </div>
    </div>
    <div class="hero">
      <p class="kicker">Offikina · Design kit</p>
      <h1>보고, 좋은 것만</h1>
      <p class="note" id="plate-note"></p>
      <dl class="tally" id="tally"></dl>
    </div>
  </header>

  <main class="cabinet">
    <div class="lip" id="lip" role="tablist" aria-label="분류"></div>
    <div class="frame">
      <div class="tray" id="tray"></div>
    </div>
  </main>

  <footer class="front">
    <p class="front-label" id="front-label">둘러보기</p>
    <p class="howto" id="howto"></p>
    <p class="front-credit" id="front-credit"></p>
    <p class="credit-side">오피키나 디자인 레퍼런스 · 각 이미지와 사이트의 권리는 원본 제작자에게 있음 · 화면 느낌은 <a href="https://jitter.video/" target="_blank" rel="noopener">Jitter</a>에서 가져왔다.</p>
  </footer>
</div>

<dialog id="detail" aria-labelledby="d-title">
  <button type="button" class="close-x" id="d-close" aria-label="닫기">×</button>
  <div class="sheet">
    <div class="fig" id="d-fig"></div>
    <div class="meta">
      <h2 id="d-title"></h2>
      <div id="d-body"></div>
      <div class="actions" id="d-actions"></div>
    </div>
  </div>
</dialog>

   "section": "ux",
   "source": "Laws of UX",
   "home": "https://lawsofux.com/",
   "items": [
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Aesthetic-Usability Effect",
     "url": "https://lawsofux.com/aesthetic-usability-effect/",
     "thumb": "https://lawsofux.com/aesthetic-usability-effect/social.png",
     "desc": "Users often perceive aesthetically pleasing design as design that’s more usable."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Choice Overload",
     "url": "https://lawsofux.com/choice-overload/",
     "thumb": "https://lawsofux.com/choice-overload/social.png",
     "desc": "The tendency for people to get overwhelmed when they are presented with a large number of options, often used interchangeably with the term paradox of choice."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Chunking",
     "url": "https://lawsofux.com/chunking/",
     "thumb": "https://lawsofux.com/chunking/social.png",
     "desc": "A process by which individual pieces of an information set are broken down and then grouped together in a meaningful whole."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Cognitive Bias",
     "url": "https://lawsofux.com/cognitive-bias/",
     "thumb": "https://lawsofux.com/cognitive-bias/social.png",
     "desc": "A systematic error of thinking or rationality in judgment that influence our perception of the world and our decision-making ability."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Cognitive Load",
     "url": "https://lawsofux.com/cognitive-load/",
     "thumb": "https://lawsofux.com/cognitive-load/social.png",
     "desc": "The amount of mental resources needed to understand and interact with an interface."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Doherty Threshold",
     "url": "https://lawsofux.com/doherty-threshold/",
     "thumb": "https://lawsofux.com/doherty-threshold/social.png",
     "desc": "Productivity soars when a computer and its users interact at a pace (<400ms) that ensures that neither has to wait on the other."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Fitts’s Law",
     "url": "https://lawsofux.com/fittss-law/",
     "thumb": "https://lawsofux.com/fittss-law/social.png",
     "desc": "The time to acquire a target is a function of the distance to and size of the target."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Flow",
     "url": "https://lawsofux.com/flow/",
     "thumb": "https://lawsofux.com/flow/social.png",
     "desc": "The mental state in which a person performing some activity is fully immersed in a feeling of energized focus, full involvement, and enjoyment in the process of the activity."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Goal-Gradient Effect",
     "url": "https://lawsofux.com/goal-gradient-effect/",
     "thumb": "https://lawsofux.com/goal-gradient-effect/social.png",
     "desc": "The tendency to approach a goal increases with proximity to the goal."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Hick’s Law",
     "url": "https://lawsofux.com/hicks-law/",
     "thumb": "https://lawsofux.com/hicks-law/social.png",
     "desc": "The time it takes to make a decision increases with the number and complexity of choices."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Jakob’s Law",
     "url": "https://lawsofux.com/jakobs-law/",
     "thumb": "https://lawsofux.com/jakobs-law/social.png",
     "desc": "Users spend most of their time on other sites. This means that users prefer your site to work the same way as all the other sites they already know."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Law of Common Region",
     "url": "https://lawsofux.com/law-of-common-region/",
     "thumb": "https://lawsofux.com/law-of-common-region/social.png",
     "desc": "Elements tend to be perceived into groups if they are sharing an area with a clearly defined boundary."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Law of Proximity",
     "url": "https://lawsofux.com/law-of-proximity/",
     "thumb": "https://lawsofux.com/law-of-proximity/social.png",
     "desc": "Objects that are near, or proximate to each other, tend to be grouped together."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Law of Prägnanz",
     "url": "https://lawsofux.com/law-of-pr%C3%A4gnanz/",
     "thumb": "https://lawsofux.com/law-of-pr%C3%A4gnanz/social.png",
     "desc": "People will perceive and interpret ambiguous or complex images as the simplest form possible, because it is the interpretation that requires the least cognitive effort of us."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Law of Similarity",
     "url": "https://lawsofux.com/law-of-similarity/",
     "thumb": "https://lawsofux.com/law-of-similarity/social.png",
     "desc": "The human eye tends to perceive similar elements as a complete picture, shape, or group, even if those elements are separated."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Law of Uniform Connectedness",
     "url": "https://lawsofux.com/law-of-uniform-connectedness/",
     "thumb": "https://lawsofux.com/law-of-uniform-connectedness/social.png",
     "desc": "Elements that are visually connected are perceived as more related than elements with no connection."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Mental Model",
     "url": "https://lawsofux.com/mental-model/",
     "thumb": "https://lawsofux.com/mental-model/social.png",
     "desc": "A compressed model based on what we think we know about a system and how it works."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Miller’s Law",
     "url": "https://lawsofux.com/millers-law/",
     "thumb": "https://lawsofux.com/millers-law/social.png",
     "desc": "The average person can only keep 7 (plus or minus 2) items in their working memory."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Occam’s Razor",
     "url": "https://lawsofux.com/occams-razor/",
     "thumb": "https://lawsofux.com/occams-razor/social.png",
     "desc": "Among competing hypotheses that predict equally well, the one with the fewest assumptions should be selected."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Paradox of the Active User",
     "url": "https://lawsofux.com/paradox-of-the-active-user/",
     "thumb": "https://lawsofux.com/paradox-of-the-active-user/social.png",
     "desc": "Users never read manuals but start using the software immediately."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Pareto Principle",
     "url": "https://lawsofux.com/pareto-principle/",
     "thumb": "https://lawsofux.com/pareto-principle/social.png",
     "desc": "The Pareto principle states that, for many events, roughly 80% of the effects come from 20% of the causes."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Parkinson’s Law",
     "url": "https://lawsofux.com/parkinsons-law/",
     "thumb": "https://lawsofux.com/parkinsons-law/social.png",
     "desc": "Any task will inflate until all of the available time is spent."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Peak-End Rule",
     "url": "https://lawsofux.com/peak-end-rule/",
     "thumb": "https://lawsofux.com/peak-end-rule/social.png",
     "desc": "People judge an experience largely based on how they felt at its peak and at its end, rather than the total sum or average of every moment of the experience."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Postel’s Law",
     "url": "https://lawsofux.com/postels-law/",
     "thumb": "https://lawsofux.com/postels-law/social.png",
     "desc": "Be liberal in what you accept, and conservative in what you send."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Selective Attention",
     "url": "https://lawsofux.com/selective-attention/",
     "thumb": "https://lawsofux.com/selective-attention/social.png",
     "desc": "The process of focusing our attention only to a subset of stimuli in an environment — usually those related to our goals."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Serial Position Effect",
     "url": "https://lawsofux.com/serial-position-effect/",
     "thumb": "https://lawsofux.com/serial-position-effect/social.png",
     "desc": "Users have a propensity to best remember the first and last items in a series."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Tesler’s Law",
     "url": "https://lawsofux.com/teslers-law/",
     "thumb": "https://lawsofux.com/teslers-law/social.png",
     "desc": "Tesler's Law, also known as The Law of Conservation of Complexity, states that for any system there is a certain amount of complexity which cannot be reduced."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Von Restorff Effect",
     "url": "https://lawsofux.com/von-restorff-effect/",
     "thumb": "https://lawsofux.com/von-restorff-effect/social.png",
     "desc": "The Von Restorff effect, also known as The Isolation Effect, predicts that when multiple similar objects are present, the one that differs from the rest is most likely to be remembered."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Working Memory",
     "url": "https://lawsofux.com/working-memory/",
     "thumb": "https://lawsofux.com/working-memory/social.png",
     "desc": "A cognitive system that temporarily holds and manipulates information needed to complete tasks."
    },
    {
     "section": "ux",
     "source": "Laws of UX",
     "title": "Zeigarnik Effect",
     "url": "https://lawsofux.com/zeigarnik-effect/",
     "thumb": "https://lawsofux.com/zeigarnik-effect/social.png",
     "desc": "People remember uncompleted or interrupted tasks better than completed tasks."
    }
   ]

  function escapeHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function domainOf(url){
    try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }

  function tilt(i){ return ((i % 5) - 2) * 0.6; }

  function isGif(src){
    return /\.gif(?:$|[?#])/i.test(src || "");
  }
  // ----- 폰트 견본 -----
  // 글꼴 파일은 킷에 받지 않는다. 카드가 화면에 보일 때만 원문 CDN에서 불러와 견본 글자를 그린다.
  const FONT_KO = "오피키나 루보네리 Aa 123";
  const FONT_LATIN = "Offikina Rubonery Aa 123";
  const fontSpecs = {};
  const fontLoaded = {};
  function fontSpec(item){
    if (!item) return null;
    if (item.font && typeof item.font === "object" && (item.font.google || item.font.fontshare || item.font.src)) return item.font;
    const e = String(item.embed || "");
    if (!e) return null;
    let m = e.match(/fonts\.googleapis\.com\/css2\?family=([^:&"']+)/);
    if (m) return {google: decodeURIComponent(m[1].replace(/\+/g," ")), weight: 400};
    m = e.match(/api\.fontshare\.com\/v2\/css\?f\[\]=([a-z0-9-]+)/i);
    if (m) return {fontshare: m[1], face: item.title || m[1], weight: 400};
    const faces = e.match(/@font-face\s*\{[^}]*\}/g) || [];
    let pick = faces.filter(function(f){ return /font-weight:\s*400\b/.test(f); })[0] || faces[0];
    if (!pick) return null;
    const fam = pick.match(/font-family:\s*['"]([^'"]+)['"]/);
    const src = pick.match(/url\(['"]?([^'")]+\.woff2?)['"]?\)/);
    const wt = pick.match(/font-weight:\s*(\d+)/);
    if (!fam || !src) return null;
    return {face: fam[1], src: src[1], weight: wt ? +wt[1] : 400};
  }
  function isKoreanFont(item){
    if (item.lang) return item.lang === "ko";
    const sp = fontSpec(item);
    if (sp){
      const k = fontKey(sp);
      const hit = (browse.groups || []).filter(function(g){ return g.section === "폰트"; })
        .reduce(function(a, g){ return a.concat(g.items || []); }, [])
        .filter(function(b){ return b.font && fontKey(b.font) === k; })[0];
      if (hit && hit.lang) return hit.lang === "ko";
    }
    return /[\uac00-\ud7a3]/.test(item.title || "") || /KR|Korean|noonnu/i.test(JSON.stringify(item.font || item.embed || ""));
  }
  function fontKey(spec){
    return spec.google ? "g:"+spec.google : (spec.fontshare ? "s:"+spec.fontshare : "n:"+spec.src);
  }
  function fontFamilyCss(spec){
    const key = fontKey(spec);
    if (spec.google) return "'"+spec.google.replace(/'/g,"")+"'";
    if (spec.fontshare) return "'"+String(spec.face||spec.fontshare).replace(/'/g,"")+"'";
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return "'kf-"+h.toString(36)+"'";
  }
  function fontSampleHTML(item, spec){
    const key = fontKey(spec);
    const text = isKoreanFont(item) ? FONT_KO : FONT_LATIN;
    const name = item.title || "";
    fontSpecs[key] = {spec: spec, family: fontFamilyCss(spec), text: (fontSpecs[key] ? fontSpecs[key].text : "") + name + text};
    const style = "font-family:"+fontSpecs[key].family+",var(--sans);font-weight:"+(+spec.weight || 400);
    return '<div class="fsample" data-fk="'+escapeHtml(key)+'" style="'+escapeHtml(style)+'"><span class="fn">'+escapeHtml(name)+'</span><span class="fs">'+escapeHtml(text)+'</span></div>';
  }
  function loadFont(key){
    if (fontLoaded[key]) return;
    const f = fontSpecs[key];
    if (!f) return;
    fontLoaded[key] = true;
    const spec = f.spec;
    const w = +spec.weight || 400;
    if (spec.google || spec.fontshare){
      const link = document.createElement("link");
      link.rel = "stylesheet";
      if (spec.google){
        const chars = Array.from(new Set(Array.from(f.text))).join("");
        link.href = "https://fonts.googleapis.com/css2?family="+encodeURIComponent(spec.google).replace(/%20/g,"+")+":wght@"+w+"&display=swap&text="+encodeURIComponent(chars);
      } else {
        link.href = "https://api.fontshare.com/v2/css?f[]="+encodeURIComponent(spec.fontshare)+"@"+w+"&display=swap";
      }
      document.head.appendChild(link);
      return;
    }
    if (!window.FontFace) return;
    try{
      const face = new FontFace(f.family.replace(/'/g,""), "url("+JSON.stringify(spec.src)+")", {weight: String(w), display:"swap"});
      document.fonts.add(face);
      face.load().catch(function(){});
    }catch(e){}
  }
  let fontObserver = null;
  function observeFonts(root){
    const els = (root || document).querySelectorAll(".fsample[data-fk]");
    if (!els.length) return;
    if (!("IntersectionObserver" in window)){
      els.forEach(function(el){ loadFont(el.getAttribute("data-fk")); });
      return;
    }
    if (!fontObserver){
      fontObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (!en.isIntersecting) return;
          loadFont(en.target.getAttribute("data-fk"));
          fontObserver.unobserve(en.target);
        });
      }, {rootMargin:"300px 0px"});
    }
    els.forEach(function(el){ fontObserver.observe(el); });
  }

  function mediaHTML(item, opts){
    opts = opts || {};
    const fspec = fontSpec(item);
    if (fspec) return fontSampleHTML(item, fspec);
    const vids = (item.videos && item.videos.length) ? item.videos : (item.video ? [item.video] : []);
    const imgs = (item.images && item.images.length) ? item.images : [];
    const img = imgs[0] || item.image || item.thumb || "";
    const gif = imgs.filter(isGif)[0] || (isGif(img) ? img : "");
    const vid = vids[0];
    if (vid){
      const poster = (img && !isGif(img)) ? ' poster="'+escapeHtml(img)+'"' : '';
      const controls = opts.controls ? ' controls' : '';
      return '<video src="'+escapeHtml(vid)+'"'+poster+' muted loop playsinline autoplay'+controls+'></video>';
    }
    if (gif) return '<img src="'+escapeHtml(gif)+'" alt="">';
    if (img) return '<img src="'+escapeHtml(img)+'" alt="" loading="lazy">';
    if (item.type === "link") return '<span class="ph" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase">link</span>';
    if (item.source_name) return '<span class="ph" style="font-size:11px;letter-spacing:.12em">'+escapeHtml(item.source_name)+'</span>';

    return '<span class="ph">'+escapeHtml(ch)+'</span>';
  }

  function copyText(text, btn){
    function done(){
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = "복사했어";
      btn.disabled = true;
      setTimeout(function(){ btn.textContent = prev; btn.disabled = false; }, 1600);
    }
    function fallback(){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try{
        document.execCommand("copy");
        done();
      }catch(e){
        alert("복사를 못 했다. 글을 직접 고르면 된다.");
      }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(fallback);

        : lip === "모션-ui"
        ? "아래 대표 사례나 페이블을 직접 보고, 원문으로 가면 된다."
        : "아래 대표 사례를 직접 보고, 원문으로 가면 된다.");
    root.appendChild(hint);

    function paintGalleries(items, title, blurb){
      if (!items.length) return;
      const t = document.createElement("p");
      t.className = "row-title";
      t.textContent = title;
      root.appendChild(t);
      if (blurb){
        const b = document.createElement("p");
        b.className = "hint";
        b.style.marginTop = "-6px";
        b.textContent = blurb;
        root.appendChild(b);
      }
      const g = document.createElement("div");
      g.className = "galleries";
      items.forEach(function(item){
        const a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = escapeHtml(item.title)+'<small>'+escapeHtml(item.note)+'</small>';
        g.appendChild(a);
      });
      root.appendChild(g);
    }
    const motionVid = GALLERIES.filter(function(g){ return g.section === "모션-영상"; });
    const notionBlurb = "";
    if (lip === "all"){
      paintGalleries(GALLERIES.filter(function(g){ return g.section !== "모션-영상"; }), "둘러볼 곳");
      paintGalleries(motionVid, "둘러볼 곳 · 모션 영상", notionBlurb);
    } else if (lip === "모션-영상"){
      paintGalleries(motionVid, "둘러볼 곳 · 모션 영상", notionBlurb);
    } else {
      paintGalleries(GALLERIES.filter(function(g){ return g.section === lip; }), "둘러볼 곳");
    }

    if (lip !== "all"){
      browseGroups(lip).forEach(function(g){
        const t = document.createElement("p");
        t.className = "row-title";
        t.setAttribute("data-browse", g.source);
        t.textContent = g.items.length === 1
          ? g.source + " · 한 편"
          : g.source + " · 대표 사례 " + g.items.length + "";
        root.appendChild(t);
        const grid = document.createElement("div");
        grid.className = "grid dense";
        g.items.forEach(function(raw, i){
          const item = Object.assign({}, raw, {source_name: raw.source, source: ""});
          grid.appendChild(card(item, i, function(){ openRec(item); }));
        });
        root.appendChild(grid);
      });
    }

    if (lip === "모션-ui"){
      const t = document.createElement("p");
      t.className = "row-title";
      t.textContent = "Fable 5.2 · 76 연구";
      root.appendChild(t);
      const grid = document.createElement("div");
      grid.className = "grid dense";
      fable.forEach(function(item, i){
        grid.appendChild(card(item, i, function(){ openFable(item); }));
      });
      root.appendChild(grid);
    }

    tray.innerHTML = "";
    tray.appendChild(root);
  }

  function renderMine(){ renderBrowse(); }

  function render(){
    plateCopy();
    renderTally();
    renderLip();
    if (mode === "browse") renderBrowse();
    else renderMine();
    observeFonts(tray);
  }

  async function boot(){ mode = "browse"; render(); }
  boot();
})();
</script>
</body>
</html>
